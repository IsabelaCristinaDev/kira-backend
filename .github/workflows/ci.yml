name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Rodar os testes
        run: ./mvnw -B test
      # Sem Docker esses testes são ignorados sem dar erro, e o CI passaria sem testar o banco nem a subida da aplicação
      - name: Conferir que os testes com banco rodaram
        run: |
          for teste in KiraBackendApplicationTests integracao.RotasComBancoRealTest integracao.ConexaoAoVivoComBancoRealTest; do
            grep -q 'skipped="0"' "target/surefire-reports/TEST-br.com.kira.kirabackend.$teste.xml"
          done

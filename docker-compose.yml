# Nome fixo: o banco e o volume do MinIO são os mesmos, seja qual for a pasta de onde o compose roda
name: kira-backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: kira_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Só a própria máquina acessa. Para liberar a outra pessoa, use uma VPN (ex.: tailscale serve)
      - "127.0.0.1:5433:5432"
    volumes:
      - kira_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Fotos enviadas, quando a API roda com KIRA_ARQUIVOS_TIPO=s3. O MinIO oficial não publica mais imagens
  # da versão gratuita; esta é a do fork mantido pela comunidade
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: kira_minio
    command: server /data --console-address ":9001"
    environment:
      # O mesmo par que a API usa para entrar. A senha precisa de pelo menos 8 caracteres
      MINIO_ROOT_USER: ${KIRA_S3_ACCESS_KEY:?Defina KIRA_S3_ACCESS_KEY no .env}
      MINIO_ROOT_PASSWORD: ${KIRA_S3_SECRET_KEY:?Defina KIRA_S3_SECRET_KEY no .env}
    ports:
      # Só a própria máquina acessa: 9000 é a API do S3 e 9001, o painel
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - kira_minio_data:/data
    restart: unless-stopped

  # IA (verificação de identidade e ordem do Provador), de outro repositório. Só sobe com o perfil "ia"
  kira-ai:
    profiles: ["ia"]
    build: ${KIRA_AI_PASTA:-../kira-ai}
    # Nome fixo da imagem: a de 12 GB já montada é reaproveitada, sem montar de novo
    image: kira-ai:local
    container_name: kira-ai
    ports:
      # A API local procura a IA na 8001 (KIRA_AI_URL). Só a própria máquina acessa
      - "127.0.0.1:8001:8000"
    # Se a IA passar disso, só ela é reiniciada
    mem_limit: ${KIRA_AI_MEMORIA:-3g}
    restart: unless-stopped

volumes:
  kira_postgres_data:
  kira_minio_data:
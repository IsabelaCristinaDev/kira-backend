# Os testes nunca enviam endereços ao serviço de verdade. Soma-se ao application.yml, sem substituí-lo
kira.geocodificacao.ativa=false
# Os testes com banco criam muitas contas pelo mesmo IP (127.0.0.1). O limite de cadastro de produção fica
# no application.yml e é testado com o número de verdade em AuthControllerLimiteTentativasTest
kira.security.rate-limit.cadastro.por-ip.maximo=100000

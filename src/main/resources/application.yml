spring:
  application:
    name: kira-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/kira_db}
    username: ${SPRING_DATASOURCE_USERNAME:kira_user}
    password: ${SPRING_DATASOURCE_PASSWORD:kira_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:seuemail@gmail.com}
    password: ${MAIL_PASSWORD:suasenha}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

kira:
  lembrete:
    antecedencia-horas: ${LEMBRETE_ANTECEDENCIA_HORAS:24}
    cron: ${LEMBRETE_CRON:0 0 * * * *}
spring:
  application:
    name: kira-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:seuemail@gmail.com}
    password: ${MAIL_PASSWORD:suasenha}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

kira:
  lembrete:
    antecedencia-horas: ${LEMBRETE_ANTECEDENCIA_HORAS:24}
    cron: ${LEMBRETE_CRON:0 0 * * * *}
    retry:
      max-tentativas: ${LEMBRETE_RETRY_MAX_TENTATIVAS:3}
      delay-ms: ${LEMBRETE_RETRY_DELAY_MS:2000}
      multiplicador: ${LEMBRETE_RETRY_MULTIPLICADOR:2}